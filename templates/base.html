<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="stylesheet" href="{{ get_url(path="styles.css") }}">
</head>
<body>
    <header class="static sm:sticky sm:top-0 z-50 flex flex-col sm:flex-row justify-between items-center px-6 py-4 gap-4">
        <a href="/" class="font-bold text-xl tracking-wider">FLAMITSU</a>
        
        <nav class="flex flex-wrap justify-center gap-4 text-sm sm:text-base">
            <a href="#about-me" class="hover:underline">ABOUT ME</a>
            <a href="#projects" class="hover:underline">PROJECTS</a>
            <a href="#stack" class="hover:underline">STACK</a>
            <a href="#contact" class="hover:underline">CONTACT</a>
        </nav>
    </header>
    <main class="max-w-32 mx-auto px-6 py-8">
        {% block content %}
        {% endblock content %}
    </main>
    <footer class="flex flex-col sm:flex-row justify-center items-center px-6 py-6 gap-2 sm:gap-4 text-xs text-neutral-400">
        <p>Flamitsu</p>
        <span class="hidden sm:inline">•</span>
        <p>Licensed under MIT</p>
        <span class="hidden sm:inline">•</span>
        <p>Built using Zola & TailwindCSS</p>
        <span class="hidden sm:inline">•</span>
        <a href="https://github.com/Flamitsu" 
        target="_blank" 
        rel="noopener noreferrer" 
        aria-label="Flamitsu's Github link"
        class="text-neutral-400 hover:text-white transition-colors">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
        </a>
    </footer>

</body>
</html>
